name: Publier un livre sur Mastodon

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mastodon-bot
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Vérifier les secrets Mastodon
        run: |
          if [ -z "${{ secrets.MASTODON_ACCESS_TOKEN }}" ]; then
            echo "❌ MASTODON_ACCESS_TOKEN manquant"
            exit 1
          fi
          if [ -z "${{ secrets.MASTODON_BASE_URL }}" ]; then
            echo "❌ MASTODON_BASE_URL manquant"
            exit 1
          fi

     - name: Installer les dépendances
       run: npm ci

     - name: Valider les données
       run: npm run validate

     - name: Publier le livre
       env:
         MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
         MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
       run: npm start

